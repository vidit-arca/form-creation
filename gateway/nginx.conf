events {}

http {
    server {
        listen 9090;

        # Backend API
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin UI
        location /admin/ {
            proxy_pass http://admin-ui:80/;
            proxy_set_header Host $host;
            sub_filter 'src="/' 'src="/admin/';
            sub_filter 'href="/' 'href="/admin/';
            sub_filter_once off;
        }

        # Patient UI (default)
        location / {
            proxy_pass http://patient-ui:80/;
            proxy_set_header Host $host;
        }
    }
}
