server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────────────────
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Disallow embedding in iframes (clickjacking)
    add_header X-Frame-Options "DENY" always;
    # Limit referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict hardware API access
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # Content Security Policy:
    #   - script-src 'self': only our own bundle
    #   - style-src 'unsafe-inline': needed for Tailwind CSS injected styles
    #   - img-src data: blob: for QR/signatures; tile host for leaflet maps
    #   - connect-src: restrict API calls to our backend only
    #   NOTE: Replace YOUR-API-HOST with the real production backend origin.
    #   In dev/docker-compose, the gateway handles routing so 'self' is enough.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Uncomment in HTTPS production deployments:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ─────────────────────────────────────────────────────────────────────────

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is critical for Single Page Applications (React Router)
        # It forces NGINX to serve index.html instead of throwing a 404
        try_files $uri $uri/ /index.html;
    }

    # NEVER cache index.html — ensures users always get the latest build
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache hashed static assets long-term (Vite generates unique filenames per build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
