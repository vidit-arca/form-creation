server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # Admin UI CSP — includes blob: worker-src for leaflet and tile img-src
    # NOTE: Replace YOUR-API-HOST with the real production backend origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Uncomment in HTTPS production deployments:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ─────────────────────────────────────────────────────────────────────────

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Support React Router for the admin dashboard
        try_files $uri $uri/ /index.html;
    }

    # NEVER cache index.html — ensures users always get the latest build
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache hashed static assets long-term (Vite generates unique filenames per build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
